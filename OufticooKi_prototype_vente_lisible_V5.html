<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OufticooKi — Test lisibilité V5</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#241c16;background:#faf8f3}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer;border:0}.app{height:100vh;height:100dvh;max-width:540px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);gap:6px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;min-height:35px}.brand{font-size:21px;font-weight:900}.tag{font-size:10px;color:#7b6c5e}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:1;min-height:0;grid-template-rows:repeat(4,minmax(0,1fr))}.product{appearance:none;-webkit-appearance:none;border-radius:12px;background:#f1e9da;border:1px solid #e2d3bc;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;overflow:hidden;font-weight:750;font-size:clamp(17px,5.1vw,24px);line-height:1.13;color:#241c16}.product span{display:block}.product small{display:block;font-size:clamp(13px,3.6vw,17px);font-weight:700;color:#5d4a37;margin-top:5px;line-height:1.1}.product.primary{background:#f2c748}.basket{background:#fff;border:1px solid #e2d3bc;border-radius:11px;padding:6px 10px;min-height:64px}.baskethead{display:flex;justify-content:space-between;font-weight:800}.lines{font-size:11px;color:#635a50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}.edit{background:transparent;text-decoration:underline;color:#61421b;font-size:11px;padding:0}.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pay button{border-radius:10px;padding:9px 2px;background:#e8e3db;font-weight:700;font-size:13px}.pay button.active{background:#252019;color:#fff}.cash{display:flex;align-items:center;gap:7px;font-size:12px}.cash input{width:80px;min-width:0;padding:6px;border:1px solid #d4c9ba;border-radius:7px}.cash span{margin-left:auto;font-weight:700}.confirm{background:#29221c;color:white;border-radius:11px;padding:12px;font-weight:850;font-size:16px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;border-top:1px solid #ddd;padding-top:6px}.nav button{background:transparent;font-size:10px;padding:4px 0;color:#66584b}.nav button:first-child{font-weight:850;color:#1d1711}.stats{display:flex;justify-content:space-between;color:#a29b91;font-size:10px;min-height:15px}.stats button{background:transparent;color:inherit;font-size:10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{background:white;border-radius:15px;padding:18px;width:min(100%,420px);max-height:80dvh;overflow:auto}.panel h2{margin:0 0 12px;font-size:19px}.panel button{padding:10px;border-radius:8px;margin:3px;background:#eee}.panel input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:7px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:7px 0;gap:6px}.row button{padding:7px}.warning{font-size:11px;color:#8b442c;text-align:center}@media(max-height:680px){.app{gap:3px}.head{min-height:26px}.brand{font-size:17px}.product{font-size:clamp(15px,4.4vw,19px)}.product small{font-size:12px}.basket{min-height:51px;padding:4px 8px}.pay button{padding:6px}.confirm{padding:8px}.nav{padding-top:3px}.cash input{padding:4px}} @media(max-height:590px){.app{gap:3px}.product{font-size:14px}.product small{font-size:11px}.basket{min-height:46px}.confirm{padding:7px}.pay button{padding:5px}.head{min-height:23px}.nav button{font-size:9px}} 
/* V4 : affichage prioritaire à la lisibilité, compact sans défilement */
.app{gap:5px;padding-top:max(3px,env(safe-area-inset-top));padding-bottom:max(3px,env(safe-area-inset-bottom))}
.head{min-height:27px;flex-shrink:0}.brand{font-size:clamp(22px,5.8vw,28px)}.tag{font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}

.extra-large .product{font-size:clamp(20px,5.8vw,29px)}.extra-large .product small{font-size:clamp(16px,4.6vw,23px)}

@media(max-height:600px){.brand{font-size:19px}.tag{font-size:9px}.product{font-size:clamp(14px,4.1vw,19px)}.product small{font-size:clamp(12px,3.3vw,15px)}.baskethead{font-size:16px}.pay button{font-size:15px;padding:4px}.confirm{font-size:15px;padding:5px}.cash{font-size:12px}.cash span{font-size:12px}.nav button{font-size:9px}.stats{font-size:9px}}

@media(max-height:590px){.tag{font-size:9px}.brand{font-size:20px}.head{min-height:24px}.basket{min-height:43px}.pay button{min-height:34px;font-size:16px}.confirm{min-height:36px;font-size:17px}.nav{min-height:29px}.nav button{min-height:26px;font-size:10px}.cash{min-height:28px}.cash input{height:27px}.product{font-size:clamp(15px,4.5vw,21px)}.product small{font-size:clamp(12px,3.5vw,17px)}}
</style></head><body><main class="app"><div class="head"><div class="brand">OufticooKi</div><div class="tag">VENTE <button type="button" class="large-toggle" onclick="toggleLarge()" aria-label="Activer ou désactiver les très grands caractères">A+</button></div></div><div class="products" id="products"><button type="button" class="product primary" onclick="choose(0)"><span>Assortiment</span><small>29,90 €/kg</small></button><button type="button" class="product " onclick="choose(1)"><span>Massepain cuit</span><small>3 €/pièce</small></button><button type="button" class="product " onclick="choose(2)"><span>Massepain cru</span><small>56 €/kg</small></button><button type="button" class="product " onclick="choose(3)"><span>Gaufre de Liège</span><small>3 €/pièce</small></button><button type="button" class="product " onclick="choose(4)"><span>Gaufre + topping</span><small>4 €/pièce</small></button><button type="button" class="product " onclick="choose(5)"><span>Vin chaud</span><small>5 €</small></button><button type="button" class="product " onclick="choose(6)"><span>Chocolat chaud</span><small>3 €</small></button><button type="button" class="product " onclick="choose(7)"><span>Autres produits</span><small>Catalogue</small></button></div><section class="basket"><div class="baskethead"><span>Panier <button class="edit" onclick="openBasket()">Modifier</button></span><span id="total">0,00 €</span></div><div class="lines" id="lines">Aucun article</div></section><div class="pay"><button class="active" onclick="pay('Liquide',this)">Liquide</button><button onclick="pay('SumUp',this)">SumUp</button><button onclick="pay('QR',this)">QR</button></div><div class="cash" id="cash"><label for="received">Reçu (€)</label><input id="received" type="number" inputmode="decimal" min="0" step="0.01" oninput="render()"><span id="change">Monnaie : 0,00 €</span></div><button class="confirm" onclick="checkout()">VALIDER LA VENTE</button><div class="nav"><button>🛒 Vente</button><button onclick="unavailable()">📦 Stocks</button><button onclick="unavailable()">👩‍🍳 Fabriquer</button><button onclick="unavailable()">🧾 Achats</button><button onclick="unavailable()">⚙️ Gestion</button></div><div class="stats"><span id="stats">CA : ••• &nbsp; Clients : •••</span><button onclick="toggleStats()" id="eye">◉ Afficher</button></div></main><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="panel" id="panel"></div></div><script>
const catalog=[['Assortiment','29,90 €/kg','weight',29.9],['Massepain cuit','3 €/pièce','piece',3],['Massepain cru','56 €/kg','weight',56],['Gaufre de Liège','3 €/pièce','piece',3],['Gaufre + topping','4 €/pièce','piece',4],['Vin chaud','5 €','piece',5],['Chocolat chaud','3 €','piece',3],['Autres produits','Catalogue','other',0]];let basket=[],payment='Liquide',turnover=0,clients=0,visible=false;const euro=x=>Number(x||0).toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';function sum(){return basket.reduce((a,b)=>a+b.amount,0)}function render(){document.getElementById('total').textContent=euro(sum());document.getElementById('lines').textContent=basket.length?basket.slice(-2).map(x=>x.name+' '+euro(x.amount)).join(' · ')+(basket.length>2?' · +'+(basket.length-2)+' autres'):'Aucun article';let received=Number(document.getElementById('received').value||0);document.getElementById('change').textContent='Monnaie : '+euro(Math.max(0,received-sum()));document.getElementById('stats').textContent=visible?'CA : '+euro(turnover)+'  ·  Clients : '+clients:'CA : •••  ·  Clients : •••'}function toggleStats(){visible=!visible;document.getElementById('eye').textContent=visible?'◉ Masquer':'◉ Afficher';render()}function pay(name,btn){payment=name;document.querySelectorAll('.pay button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('cash').style.display=name==='Liquide'?'flex':'none'}function show(html){document.getElementById('panel').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function add(name,amount,details){basket.push({name,amount,details});closeModal();render()}function choose(i){let p=catalog[i];if(p[2]==='other'){show('<h2>Autres produits</h2><p>Dans la caisse complète, ce menu affichera ton catalogue personnalisable.</p><button onclick="closeModal()">Fermer</button>');return}if(p[2]==='weight'){show(`<h2>${p[0]}</h2><p>Prix : ${p[1]}</p><label>Montant indiqué par la balance (€)</label><input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Ex. 8,70"><button onclick="addWeight(${i})">Ajouter au panier</button><button onclick="closeModal()">Annuler</button>`);return}add(p[0],p[3],'1 pièce')}function addWeight(i){let a=Number(document.getElementById('amount').value);if(!(a>0)){alert('Indique un montant positif.');return}add(catalog[i][0],Math.round(a*100)/100,(a/catalog[i][3]).toFixed(3)+' kg')}function openBasket(){show('<h2>Modifier le panier</h2>'+(basket.length?basket.map((x,i)=>`<div class="row"><span>${x.name}<br><small>${x.details} · ${euro(x.amount)}</small></span><button onclick="removeItem(${i})">Retirer</button></div>`).join(''):'<p>Panier vide</p>')+'<button onclick="closeModal()">Terminer</button>')}function removeItem(i){basket.splice(i,1);openBasket();render()}function checkout(){if(!basket.length){alert('Le panier est vide.');return}if(payment==='Liquide'&&Number(document.getElementById('received').value||0)<sum()){alert('Le montant reçu est inférieur au total.');return}turnover+=sum();clients++;basket=[];document.getElementById('received').value='';render();alert('Vente de test validée. Attention : aucune donnée n’est enregistrée durablement.')}function toggleLarge(){document.body.classList.toggle("extra-large");}function unavailable(){show('<h2>Fonction en préparation</h2><p>Ce fichier sert uniquement à tester la disposition et l’encaissement sur iPhone. La caisse complète viendra ensuite.</p><button onclick="closeModal()">Fermer</button>')}render();</script></body></html>
